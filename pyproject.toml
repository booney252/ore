[project]
name = "cse"
version = "0.1.0"
description = "Creative strategy engine: research layer (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.14",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5"]

[project.scripts]
cse = "cse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cse"]
